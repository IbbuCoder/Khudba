<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b5d3b" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Khutbah" />
    <meta name="description" content="Personal khutbah reading script: Everything Has a Reason — Trusting Allah’s Wisdom." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Khutbah Reader</title>
    <script>
      // GitHub Pages "Deploy from a branch" serves this file unbuilt. Vite
      // replaces %MODE% when it builds, so if the placeholder is still here we
      // are the raw source: go to the built copy of the site in ./site/.
      if ('%MODE%'.charAt(0) === '%') location.replace('./site/' + location.hash);
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a white flash in dark mode.
      try {
        var s = JSON.parse(localStorage.getItem('khutbah-reader:settings') || '{}');
        var t = s.theme === 'dark' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view the khutbah script.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
